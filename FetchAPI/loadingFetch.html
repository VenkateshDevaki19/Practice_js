<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fetch API with loading spinner</title>
</head>

<body>

    <button onclick="fetchData()">Fetch Data</button>

    <p id="loading"></p>

    <div id="result"></div>


    <script>
        async function fetchData() {
            document.getElementById('loading').innerHTML = 'loading...'; // adding loading word to display before data fetch

            try {
                const resp = await fetch('https://jsonplaceholder.typicode.com/todos/1');

                const data = await resp.json();

                document.getElementById('result').innerHTML = `
                <h3>${data.title}</h3>
                `;
            } catch (error) {
                console.log(error);
            } finally {
                document.getElementById('loading').innerHTML = ''; // emptying the loading in finally
            }
        }
    </script>

</body>

</html>
